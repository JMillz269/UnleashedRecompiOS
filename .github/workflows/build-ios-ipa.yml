name: Build iOS IPA (Unsigned - Sideload)

on:
  push:
    branches:
      - metal
  pull_request:
    branches:
      - metal
  workflow_dispatch:

jobs:
  build-ios-ipa:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Xcode
        run: |
          sudo xcode-select --switch /Applications/Xcode.app/Contents/Developer
          xcodebuild -version

      - name: Install dependencies
        run: |
          # install general build tools
          brew install cmake ninja

          # Prepare vcpkg locally (idempotent)
          if [ -d "thirdparty/vcpkg/.git" ]; then
            echo "vcpkg repo exists, updating..."
            git -C thirdparty/vcpkg fetch --all --prune
            git -C thirdparty/vcpkg reset --hard origin/master || git -C thirdparty/vcpkg reset --hard origin/main || true
          else
            echo "Cloning vcpkg..."
            rm -rf thirdparty/vcpkg
            git clone https://github.com/microsoft/vcpkg thirdparty/vcpkg
          fi

          # Bootstrap vcpkg if needed (creates vcpkg executable)
          if [ ! -x "./thirdparty/vcpkg/vcpkg" ]; then
            echo "Bootstrapping vcpkg..."
            ./thirdparty/vcpkg/bootstrap-vcpkg.sh
          else
            echo "vcpkg executable already present"
          fi

          # Choose vcpkg triplet based on runner architecture and export it
          ARCH="$(uname -m || true)"
          if [ "$ARCH" = "arm64" ]; then
            TRIPLET="arm64-osx"
          else
            TRIPLET="x64-osx"
          fi
          echo "TRIPLET=${TRIPLET}" >> $GITHUB_ENV
          echo "Using vcpkg triplet: ${TRIPLET}"

          # Try to install dxc for the detected triplet, fallback to generic install
          ./thirdparty/vcpkg/vcpkg install dxc:"${TRIPLET}" || ./thirdparty/vcpkg/vcpkg install dxc || true

          # export VCPKG_ROOT for subsequent steps
          echo "VCPKG_ROOT=${PWD}/thirdparty/vcpkg" >> $GITHUB_ENV

      - name: Locate dxc and set DIRECTX_DXC_TOOL
        run: |
          # Compute TRIPLET if not set (robustness for reruns)
          if [ -z "${TRIPLET}" ]; then
            ARCH="$(uname -m || true)"
            if [ "$ARCH" = "arm64" ]; then
              TRIPLET="arm64-osx"
            else
              TRIPLET="x64-osx"
            fi
          fi

          # First try the common vcpkg-installed path for the triplet
          DXC_PATH="${PWD}/thirdparty/vcpkg/installed/${TRIPLET}/tools/dxc/dxc"

          # If not found at the triplet path, try any dxc under installed/
          if [ ! -x "$DXC_PATH" ]; then
            DXC_PATH="$(find "${PWD}/thirdparty/vcpkg/installed" -type f -name dxc -perm -111 -print -quit 2>/dev/null || true)"
          fi

          # fallback](#)
