name: Build iOS IPA (Unsigned - Sideload)

on:
  push:
    branches:
      - metal
  pull_request:
    branches:
      - metal
  workflow_dispatch:

jobs:
  build-ios-ipa:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Xcode
        run: |
          sudo xcode-select --switch /Applications/Xcode.app/Contents/Developer
          xcodebuild -version

      - name: Install dependencies
        run: |
          # install general build tools
          brew install cmake ninja

          # Prepare vcpkg locally (idempotent)
          if [ -d "thirdparty/vcpkg/.git" ]; then
            echo "vcpkg repo exists, updating..."
            git -C thirdparty/vcpkg fetch --all --prune
            git -C thirdparty/vcpkg reset --hard origin/master || git -C thirdparty/vcpkg reset --hard origin/main || true
          else
            echo "Cloning vcpkg..."
            rm -rf thirdparty/vcpkg
            git clone https://github.com/microsoft/vcpkg thirdparty/vcpkg
          fi

          # Bootstrap vcpkg if needed (creates vcpkg executable)
          if [ ! -x "./thirdparty/vcpkg/vcpkg" ]; then
            echo "Bootstrapping vcpkg..."
            ./thirdparty/vcpkg/bootstrap-vcpkg.sh
          else
            echo "vcpkg executable already present"
          fi

          # export VCPKG_ROOT for subsequent steps
          echo "VCPKG_ROOT=${PWD}/thirdparty/vcpkg" >> $GITHUB_ENV

      - name: Generate SPIR-V headers for iOS
        run: |
          # Configure a macOS build with dxc to generate SPIR-V headers
          mkdir -p out/generate-spirv
          cd out/generate-spirv
          
          # Configure with macOS preset (not iOS) to allow dxc to compile shaders
          cmake -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_TOOLCHAIN_FILE="${VCPKG_ROOT}/scripts/buildsystems/vcpkg.cmake" \
            -DVCPKG_TARGET_TRIPLET="arm64-osx" \
            -DUNLEASHED_RECOMP_METAL=ON \
            ../..
          
          # Build only the shader headers (this generates the .spirv.h files)
          cmake --build . --target UnleashedRecompShaders
          
          cd ../..
          echo "SPIR-V headers generated successfully"

      - name: Configure iOS build with CMake
        run: |
          # Configure for iOS using the pregenerated SPIR-V headers
          cmake --preset ios-xcode-release \
            -DUNLEASHED_RECOMP_IOS_ENABLE_CODE_SIGNING=OFF

      - name: Build iOS app with Xcode
        run: |
          cmake --build --preset ios-xcode-release --config Release

      - name: Create Payload directory
        run: |
          mkdir -p Payload
          cp -r out/build/ios-xcode-release/Release-iphoneos/Unleashed\ Recompiled.app Payload/

      - name: Create unsigned IPA
        run: |
          cd Payload
          zip -r ../UnleashedRecomp-unsigned.ipa .
          cd ..

      - name: Upload iOS IPA as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: UnleashedRecomp-iOS-unsigned-IPA
          path: UnleashedRecomp-unsigned.ipa
          retention-days: 30
